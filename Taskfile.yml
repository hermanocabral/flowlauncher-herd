# Taskfile for Herd — https://taskfile.dev
# Flow Launcher is Windows-only, so these recipes target Windows: go-task's built-in
# POSIX-sh interpreter runs the simple steps and Windows-specific steps shell out to PowerShell.
version: "3"

vars:
  PLUGIN_DIR: src/Flow.Launcher.Plugin.Herd
  TEST_DIR: tests/Flow.Launcher.Plugin.Herd.Tests
  PLUGIN_NAME: Flow.Launcher.Plugin.Herd
  DIST: dist
  PUBLISH_DIR: dist/publish
  VERSION:
    sh: powershell -NoProfile -Command "(Get-Content '{{.PLUGIN_DIR}}/plugin.json' -Raw | ConvertFrom-Json).Version"
  # Normalise backslashes to forward slashes so the paths survive shell re-interpolation.
  FLOW_PLUGINS:
    sh: echo "${APPDATA//\\//}/FlowLauncher/Plugins"
  FLOW_EXE:
    sh: echo "${LOCALAPPDATA//\\//}/FlowLauncher/Flow.Launcher.exe"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  setup:
    desc: Install the dotnet templates/tools this repo expects
    cmds:
      - dotnet new install Flow.Launcher.Plugin.Template
      - dotnet new install TUnit.Templates
      - dotnet restore

  build:
    desc: Build the solution (Release)
    cmds:
      - dotnet build -c Release --nologo

  test:
    desc: Run the TUnit test suite (Microsoft.Testing.Platform)
    cmds:
      - dotnet test

  test:watch:
    desc: Re-run tests on file changes (TDD loop)
    cmds:
      - dotnet watch --project {{.TEST_DIR}} test

  format:
    desc: Apply code style fixes
    cmds:
      - dotnet format

  lint:
    desc: Verify code style without making changes
    cmds:
      - dotnet format --verify-no-changes

  clean:
    desc: Remove build and dist artifacts
    cmds:
      - dotnet clean --nologo || true
      - powershell -NoProfile -Command "if (Test-Path '{{.DIST}}') { Remove-Item -Recurse -Force '{{.DIST}}' }"

  publish:
    desc: Publish the plugin to dist/publish
    deps: [test]
    cmds:
      - powershell -NoProfile -Command "if (Test-Path '{{.PUBLISH_DIR}}') { Remove-Item -Recurse -Force '{{.PUBLISH_DIR}}' }"
      - dotnet publish {{.PLUGIN_DIR}} -c Release -o {{.PUBLISH_DIR}} --nologo

  package:
    desc: Build the release zip in dist/
    deps: [publish]
    cmds:
      - powershell -NoProfile -Command "Compress-Archive -Path '{{.PUBLISH_DIR}}/*' -DestinationPath '{{.DIST}}/{{.PLUGIN_NAME}}-{{.VERSION}}.zip' -Force"
      - 'echo Packaged {{.DIST}}/{{.PLUGIN_NAME}}-{{.VERSION}}.zip'

  install:local:
    desc: Build and install the plugin into the local Flow Launcher (stops Flow to replace the DLL)
    deps: [publish]
    cmds:
      # Flow must be closed first — a running instance holds the plugin DLL locked, so the copy
      # would silently leave the old build in place. Run `task dev` (or `task reload`) to restart it.
      - powershell -NoProfile -Command "Get-Process Flow.Launcher -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Milliseconds 800; $d='{{.FLOW_PLUGINS}}/{{.PLUGIN_NAME}}'; if (Test-Path $d) { Remove-Item -Recurse -Force $d }; Copy-Item -Recurse -Force '{{.PUBLISH_DIR}}' $d"
      - 'echo Installed to {{.FLOW_PLUGINS}}/{{.PLUGIN_NAME}}'

  uninstall:local:
    desc: Remove the plugin from the local Flow Launcher
    cmds:
      - powershell -NoProfile -Command "$d='{{.FLOW_PLUGINS}}/{{.PLUGIN_NAME}}'; if (Test-Path $d) { Remove-Item -Recurse -Force $d }"

  reload:
    desc: Restart Flow Launcher (picks up plugin changes)
    cmds:
      - powershell -NoProfile -Command "Get-Process Flow.Launcher -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue; Start-Sleep -Seconds 1; Start-Process '{{.FLOW_EXE}}'; exit 0"

  dev:
    desc: Install locally and restart Flow Launcher
    cmds:
      - task: install:local
      - task: reload

  docs:serve:
    desc: Serve the docs site locally (requires Ruby + Jekyll)
    dir: docs
    cmds:
      - bundle exec jekyll serve --livereload

  verify:signed:
    desc: Fail if any commit on the current branch is unsigned
    cmds:
      - |
        if git log --pretty=%G? | grep -qvE '^[GU]$'; then
          echo "ERROR: unsigned (or bad) commits found. Sign every commit before pushing.";
          git log --pretty='%h %G? %s' | grep -vE ' [GU] ' || true;
          exit 1;
        fi
        echo "All commits are signed."

  push:
    desc: Push to GitHub (refuses unless every commit is signed)
    deps: [verify:signed]
    cmds:
      - git push {{.CLI_ARGS}}

  release:
    desc: 'Tag the current plugin.json version and push it to trigger a release (signed only)'
    deps: [verify:signed]
    cmds:
      - git tag -a "v{{.VERSION}}" -m "Herd v{{.VERSION}}"
      - git push origin "v{{.VERSION}}"
